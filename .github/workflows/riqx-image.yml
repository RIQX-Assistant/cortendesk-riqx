# RIQX: build the branded, bilingual panel image and push it to GHCR.
# Run by hand (Actions -> RIQX panel image -> Run workflow) or by pushing a
# tag like riqx-1.12.0-r1. The server pulls ghcr.io/riqx-assistant/cortendesk-riqx.
name: RIQX panel image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag, e.g. 1.12.0-r1"
        required: true
  push:
    tags: ["riqx-*"]

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Right-to-left stylesheets are up to date
        run: |
          sh riqx/build-rtl.sh
          git diff --exit-code -- public/assets/css || { echo "::error::run riqx/build-rtl.sh and commit the .rtl.css files"; exit 1; }

      - name: Translation files are valid
        run: |
          php -r 'foreach (["lang/en.json","lang/fa.json"] as $f) { json_decode(file_get_contents($f), true, 512, JSON_THROW_ON_ERROR); echo "$f ok\n"; }'

      - id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then t="${{ github.event.inputs.tag }}"; else t="${GITHUB_REF_NAME#riqx-}"; fi
          echo "tag=$t" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/riqx-assistant/cortendesk-riqx:${{ steps.tag.outputs.tag }}
            ghcr.io/riqx-assistant/cortendesk-riqx:latest
          labels: |
            org.opencontainers.image.title=RIQX panel
            org.opencontainers.image.description=RIQX remote desktop console (fork of CortenDesk, AGPL-3.0)
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0
            org.opencontainers.image.version=${{ steps.tag.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
